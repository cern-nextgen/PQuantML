name: CI

on:
  push:
    branches: ["main", "dev", "add_ci_cd_pipelines"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: cern-nextgen-h100
    needs: lint
    container: registry.cern.ch/ngt/lxplus-like:9
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        backend: ["tensorflow", "torch"]
        include:
          - backend: tensorflow
            tests: >-
              tests/test_ap.py
              tests/test_pdp.py
              tests/test_wanda.py
              tests/test_torch_pruning_layers.py
              tests/test_quantizer_parity.py
              tests/test_keras_compression_layers.py
              tests/test_keras_onnx_converter.py
              tests/test_keras_alkaid_conversion.py
              tests/test_hgq_keras.py
          - backend: torch
            tests: >-
              tests/test_ap.py
              tests/test_pdp.py
              tests/test_wanda.py
              tests/test_torch_compression_layers.py
              tests/test_torch_onnx_converter.py
              tests/test_torch_alkaid_conversion.py
              tests/test_torch_checkpoint.py
              tests/test_torch_missing_quantizer_tracing.py
              tests/test_hgq_torch.py
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
      PIP_CACHE_DIR: /__w/_temp/pip-cache\
      NVIDIA_TF32_OVERRIDE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          python3 -m pip install --user uv
          python3 -m uv venv --seed --python ${{ matrix.python-version }} .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify interpreter
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.'))), sys.version"

      - name: Show GPU
        run: nvidia-smi

      - name: Install verilator (conda-forge)
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C /usr/local bin/micromamba
          micromamba create -y -p /opt/verilator -c conda-forge verilator make cxx-compiler
          echo "PATH=$PATH:/opt/verilator/bin" >> "$GITHUB_ENV"
          echo "VERILATOR_ROOT=/opt/verilator/share/verilator" >> "$GITHUB_ENV"
          /opt/verilator/bin/verilator --version

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" onnx onnxruntime alkaid
          python -m pip list

      - name: Run tests
        run: pytest -v --durations=20 ${{ matrix.tests }}

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
